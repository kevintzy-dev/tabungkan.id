<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABUNGKAN - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="logo">
                <i class="fas fa-shield-alt" style="color: #ffcc00;"></i> ADMIN PANEL
            </div>
            <button id="logoutBtn" class="logout-btn-small"><i class="fas fa-sign-out-alt"></i> KELUAR</button>
        </div>

        <div class="summary-card balance-card" style="margin-bottom: 24px;">
            <h3>TOTAL PENGGUNA TERDAFTAR (USER)</h3>
            <h2 id="totalUsersCounter" style="color: #00e5ff; font-size: 48px;">0</h2>
        </div>

        <div class="dashboard-card history-section">
            <h3 class="section-title">DAFTAR AKUN PENGGUNA</h3>
            <div class="transaction-list" id="adminUserList">
                <p class="empty-state">Belum ada user yang mendaftar.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
